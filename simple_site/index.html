<!DOCTYPE html>
<html>
<head>
  <title>Ansible Deployment</title>
  <style>
    body {
      margin: 0;
      font-family: Segoe UI, Arial;
      background: #f2f4f7;
    }

    .hero {
      background-image: url("images/hero.jpg");
      background-size: cover;
      background-position: center;
      height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 42px;
      font-weight: bold;
      text-shadow: 2px 2px 10px black;
    }

    .subtitle {
      font-size: 20px;
      margin-top: 10px;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 25px;
      padding: 30px;
    }

    .card {
      width: 260px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      overflow: hidden;
      text-align: center;
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      padding: 25px;
    }

    .gallery img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
  </style>
</head>

<body>

  <div class="hero">
    Ansible Deployment
    <div class="subtitle">By Kiruthika</div>
  </div>

  <div class="container">
    <div class="card">
      <img src="images/server.jpg">
      <h3>Server Automation</h3>
      <p>Automated deployments</p>
    </div>

    <div class="card">
      <img src="images/devops.jpg">
      <h3>DevOps</h3>
      <p>CI/CD pipelines</p>
    </div>

    <div class="card">
      <img src="images/cloud.jpg">
      <h3>Cloud</h3>
      <p>Scalable infrastructure</p>
    </div>
  </div>

  <div class="gallery">
    <img src="images/g1.jpg">
    <img src="images/g2.jpg">
    <img src="images/g3.jpg">
    <img src="images/g4.jpg">
    <img src="images/g1.jpg">
    <img src="images/g2.jpg">
    <img src="images/g3.jpg">
    <img src="images/g4.jpg">
  </div>

</body>
</html>

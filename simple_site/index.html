<!DOCTYPE html>
<html>
<head>
  <title>Kiruthika - Ansible Demo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
    }

    .hero {
      background-image: url("https://picsum.photos/1200/400");
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 36px;
      font-weight: bold;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 30px;
    }

    .card {
      width: 250px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      overflow: hidden;
      text-align: center;
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card h3 {
      margin: 10px 0;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 20px;
    }

    .gallery img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="hero">
    Hello from Ansible
  </div>

  <div class="container">
    <div class="card">
      <img src="https://picsum.photos/300/200?1">
      <h3>Server</h3>
      <p>Deployed using Ansible</p>
    </div>

    <div class="card">
      <img src="https://picsum.photos/300/200?2">
      <h3>Automation</h3>
      <p>Zero manual work</p>
    </div>

    <div class="card">
      <img src="https://picsum.photos/300/200?3">
      <h3>DevOps</h3>
      <p>Modern IT practice</p>
    </div>
  </div>

  <div class="gallery">
    <img src="https://picsum.photos/200/200?4">
    <img src="https://picsum.photos/200/200?5">
    <img src="https://picsum.photos/200/200?6">
    <img src="https://picsum.photos/200/200?7">
    <img src="https://picsum.photos/200/200?8">
    <img src="https://picsum.photos/200/200?9">
    <img src="https://picsum.photos/200/200?10">
    <img src="https://picsum.photos/200/200?11">
  </div>

</body>
</html>

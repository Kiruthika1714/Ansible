<!DOCTYPE html>
<html>
<head>
  <title>Ansible Deployment</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
    }

    .hero {
      background-image: url("https://images.unsplash.com/photo-1518770660439-4636190af475");
      background-size: cover;
      background-position: center;
      height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 40px;
      font-weight: bold;
      text-shadow: 2px 2px 8px black;
    }

    .subtitle {
      font-size: 20px;
      font-weight: normal;
      margin-top: 10px;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 30px;
    }

    .card {
      width: 260px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      overflow: hidden;
      text-align: center;
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card h3 {
      margin: 10px 0;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 20px;
    }

    .gallery img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <!-- Hero -->
  <div class="hero">
    Ansible Lightning Talk
    <div class="subtitle">By Kiruthika</div>
  </div>

  <!-- Cards -->
  <div class="container">
    <div class="card">
      <img src="https://images.unsplash.com/photo-1558494949-ef010cbdcc31">
      <h3>Server Automation</h3>
      <p>Automated deployment</p>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1519389950473-47ba0277781c">
      <h3>DevOps</h3>
      <p>CI/CD and infra</p>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1581092160607-ee22621dd758">
      <h3>Cloud</h3>
      <p>Scalable systems</p>
    </div>
  </div>

  <!-- Gallery -->
  <div class="gallery">
    <img src="https://images.unsplash.com/photo-1526378722447-4ad84b0d6f9c">
    <img src="https://images.unsplash.com/photo-1504384308090-c894fdcc538d">
    <img src="https://images.unsplash.com/photo-1518779578993-ec3579fee39f">
    <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085">
    <img src="https://images.unsplash.com/photo-1535223289827-42f1e9919769">
    <img src="https://images.unsplash.com/photo-1551434678-e076c223a692">
    <img src="https://images.unsplash.com/photo-1517433456452-f9633a875f6f">
    <img src="https://images.unsplash.com/photo-1585079542156-2755d9c8a094">
  </div>

</body>
</html>
